# House of Novels - Centralized Configuration
# All hardcoded values moved here for easy tuning

# Global defaults
global:
  default_model: "openai/gpt-4.1-nano"  # Primary: $0.10/M input, $0.40/M output, 1M context, 32K output, reliable JSON schema
  fallback_models:  # Automatic fallbacks if primary fails - ONLY models with reliable json_schema support
    - "openai/gpt-4o-mini"   # Fallback 1: Proven structured output, $0.15/M input, $0.60/M output
    - "openai/gpt-4.1-mini"  # Fallback 2: Higher quality, $0.40/M input, $1.60/M output
    # REMOVED: "anthropic/claude-3-haiku" - returns plain prose instead of JSON (json_schema unreliable on OpenRouter)
    # REMOVED: "mistralai/mistral-7b-instruct" - returns plain prose instead of JSON
    # REMOVED: "qwen/qwen-turbo" - returns plain prose instead of JSON
    # REMOVED: "deepseek/deepseek-chat-v3" - incompatible with "Paid model training" data policy
  default_temperature: 0.7
  default_token_limit: 8000
  max_concurrent_api_calls: 25  # Global cap on simultaneous OpenRouter API calls (threading.Semaphore)
  agent_call_timeout: 300   # Max seconds per parallel agent call (prevents hung LLM calls from blocking pipeline)
  debate_timeout: 600       # Max seconds per full debate (outer timeout for Step 2 parallel debates)

# Phase 0: Plot Expansion (single GPT-5.3 call to generate rich multi-genre plots)
phase0_plot_expansion:
  model: "openai/gpt-5.3-chat"  # Latest GPT-5.3 — ONLY used for this single expansion call (costly)
  temperature: 0.8
  token_limits:
    expansion: 16000  # Main plot generation (6 genre plots at 150-300 words each)
    critique: 8000    # Per-agent critique (uses default cheap model)
    vote: 4000        # Per-agent vote (uses default cheap model)
  genres:
    - "Horror"
    - "Sci-Fi"
    - "Mystery"
    - "Thriller"
    - "Cyberpunk"
    - "Dystopian"
  eval_model: "openai/gpt-5.3-chat"  # Same as expansion — quality debate needs quality agents
  evaluation:
    parallel: true
    max_workers: 3
    max_deliberation_rounds: 3  # Max vote rounds before forced tiebreak

# Step-level configuration (Phase 1)
steps:
  # Step 0: Theme Foundation
  step0_theme:
    temperature: 0.7
    token_limits:
      general: 16000  # Increased for GPT-5-nano reasoning tokens (psychology tasks need 8K reasoning + 8K output)
    parallel_processing:
      enabled: true
      max_workers: 5

  # Step 1: Character Creation
  step1_characters:
    temperature: 0.7
    token_limits:
      general: 8000
    parallel_processing:
      enabled: true
      character_level: true
      debate_level: true
      max_workers_characters: 6
      max_workers_debates: 5

  # Step 2: Story Shape & Genre
  step2_story_shape:
    temperature: 0.7
    token_limits:
      general: 8000
    parallel_processing:
      enabled: true
      max_workers: 5

  # Step 3: Plot Structure
  step3_plot_structure:
    temperature: 0.7
    token_limits:
      general: 8000
    structure:
      num_save_the_cat_beats: 15
    parallel_processing:
      enabled: true
      max_workers: 5

  # Step 4: World Building
  step4_world_building:
    temperature: 0.7
    token_limits:
      general: 8000
      economy: 8000
      government: 8000
      religion: 8000
    parallel_processing:
      enabled: true
      location_level: true
      debate_level: true
      max_workers_locations: 6
      max_workers_debates: 5

  # Step 5: Scene Breakdown
  step5_scene_breakdown:
    temperature: 0.7
    token_limits:
      general: 8000
    structure:
      num_chapters: 11
      scenes_per_chapter_min: 2
      scenes_per_chapter_max: 4
      num_save_the_cat_beats: 15
      critiques_per_proposal_min: 3
      critiques_per_proposal_max: 5
    parallel_processing:
      enabled: true
      chapter_level: true
      debate_level: true
      max_workers_chapters: 6
      max_workers_debates: 5

  # Step 5B: Foreshadowing
  step5b_foreshadowing:
    temperature: 0.7
    token_limits:
      general: 8000
    tracking:
      rule_of_three_required: true  # 1 of 3, 2 of 3, 3 of 3
    parallel_processing:
      enabled: true
      max_workers: 5

  # Step 5C: Interconnection
  step5c_interconnection:
    temperature: 0.7
    token_limits:
      general: 8000
    parallel_processing:
      enabled: true
      scene_level: true
      analysis_level: true
      max_workers_scenes: 6
      max_workers_analysis: 5

  # Step 6: Prose Generation (MOST DETAILED)
  step6_prose_generation:
    model: "openai/gpt-4.1-nano"  # Best prose quality with reliable JSON schema; switch to gpt-4.1-mini for ~3x higher cost but better quality
    temperature: 0.7
    token_limits:
      prose_proposal: 16000   # Long prose needs more tokens
      prose_critique: 12000   # Increased: critiques need room for detailed analysis
      prose_synthesis: 16000  # Reduced: actual output ~5K tokens; 32K caused reasoning token exhaustion in gpt-4.1-nano
      dialogue_analysis: 12000  # Increased: complex dialogue analysis
      dialogue_vote: 6000    # Increased: reasoning about vote needs space
      vote: 6000             # Increased: vote reasoning needs space
    targets:
      words_per_scene_min: 1500
      words_per_scene_max: 2000
      sensory_count: 2  # Primary senses per scene
      active_voice_percent: 80
      passive_voice_percent: 20
    parallel_processing:
      enabled: true  # Enable parallel chapter processing
      max_workers: 6  # Number of concurrent chapters (6× speedup, safe for rate limits with global semaphore)

  # Step 7: Revision & Critique
  step7_revision:
    reviser_model: "gpt-5.3"  # GPT-5 series for final prose quality
    temperature: 0.7
    token_limits:
      critique: 8000
      revision: 16000
      scene_critique: 8000
      chapter_critique: 10000
      story_critique: 12000
    revision_strategy:
      multi_pass: true  # Run critiques, revise, re-critique
      max_passes: 2
      score_threshold: 7.5  # Don't revise if score above this
    critique_levels:
      scene_level: true
      chapter_level: true
      story_level: true
    parallel_processing:
      enabled: true  # Enable parallel chapter revision
      max_workers: 6  # Number of concurrent scenes (6× speedup, safe for rate limits)

  # Step 8: Title Naming
  step8_naming:
    temperature: 0.7
    token_limits:
      general: 8000
    parallel_processing:
      enabled: true
      proposal_level: true
      debate_level: true
      max_workers_proposals: 6
      max_workers_debates: 5

# Phase 2: Prompt Generation
# TTS Configuration (Qwen3-TTS direct inference)
tts:
  narration_mode: "multi_cast"             # "single_narrator" or "multi_cast"
  device: "cuda"                          # "cuda", "cpu", "auto"
  precision: "bfloat16"                   # "bfloat16", "float16", "float32"
  model_size: "1.7B"                      # "1.7B" or "0.6B"
  narrator_voice:
    type: "clone"                         # "custom" or "clone"
    # speaker: "Ryan"                     # CustomVoice preset (Ryan, Aiden, Vivian, Serena, etc.)
    clone_ref_audio: "audio_inputs/rowan_whitmore.mp3"
    clone_ref_text: ""                    # Transcript of ref audio; leave empty for x_vector_only mode
  pause_between_speakers_ms: 600          # Silence between different speakers
  pause_within_speaker_ms: 300            # Silence between same speaker entries
  output_format: "wav"                    # "wav" (native) or "mp3"
  language: "English"                     # Default language for TTS
  # LoRA-specific settings (only used when narration_mode: "lora")
  lora:
    adapter_dir: ""                       # Root dir for adapters; empty = forge/{ts}/lora_adapters/
    fallback_to_design: true              # If adapter missing, fall back to VoiceDesign
    training:
      samples_per_character: 12           # Training samples to generate per character
      epochs: 12                          # LoRA training epochs
      learning_rate: 5.0e-6               # LoRA learning rate
      lora_rank: 32                       # LoRA rank (r)
      lora_alpha: 128                     # LoRA alpha scaling
      max_audio_duration_sec: 30          # Max audio duration for training samples

# Audio Script Annotation LLM (generates audio scripts from scene metadata)
annotation_llm:
  provider: "openrouter"                    # "ollama", "lmstudio", "openrouter", "openai"
  # base_url: "http://localhost:11434/v1"   # Ollama
  # base_url: "http://localhost:1234/v1"    # LM Studio
  base_url: "https://openrouter.ai/api/v1" # OpenRouter
  # base_url: "https://api.openai.com/v1"  # OpenAI
  # model: "qwen3.5:9b"                    # Local Ollama model
  model: "openai/gpt-4.1-nano"             # Cheap, excellent at structured JSON
  api_key: "env:OPR_ROUTER_API_KEY"         # "ollama" for local, "env:VAR_NAME" for env var
  temperature: 0.3                          # Lower = more consistent scripts
  max_tokens: 4000                          # Max output tokens per scene script

# Phase 2: Prompt Generation
phase2_scene_prompts:
  max_character_layers: 3  # Max characters with individual layers; excess become background figures
  shot_selection:
    enabled: true       # Set false to disable shot selection (uses full_shot default)
    force_shot_type:    # Override shot type for all scenes (for testing); null = auto-select
